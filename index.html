<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Music</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<style>
  :root{
    --ink: #FFF6E8;
    --ink-soft: #FFEBD0;
    --panel: #FFFFFF;
    --panel-line: #FFD9A0;
    --ivory: #4A3728;
    --ivory-dim: #93795F;
    --brass: #FF9E44;
    --brass-dim: #F2872A;
    --ebony: #4A3728;
    --good: #6FCF97;
    --bad: #F2704F;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Nunito', sans-serif;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(255,159,68,0.16), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(255,127,89,0.12), transparent 50%);
    color: var(--ivory);
    min-height:100vh;
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; animation: rise .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform:none; } }

  h1{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 2.1rem; letter-spacing:-0.01em; }
  .subtitle{ color: var(--ivory-dim); font-size: 0.98rem; margin-top: 8px; line-height:1.5; }

  /* ---------- Home ---------- */
  #screen-home{ padding: 32px 24px 40px; max-width: 460px; margin: 0 auto; width:100%; }
  .home-header{ margin-bottom: 26px; text-align:center; }
  .level-grid{ display:flex; flex-direction:column; gap: 18px; }
  .level-card{
    background: var(--panel);
    border: 2px solid var(--panel-line);
    border-radius: 20px;
    padding: 30px 22px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow: 0 4px 0 var(--panel-line);
    transition: border-color .15s ease, transform .12s ease, background .15s ease, box-shadow .12s ease;
  }
  .level-card:hover{ border-color: var(--brass); background:#FFFBF3; transform: translateY(-2px); }
  .level-card:active{ transform: translateY(2px); box-shadow: 0 2px 0 var(--panel-line); }
  .level-card.practice-card{ border-color: var(--brass); background: #FFF3E0; }
  .level-card .level-name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.7rem; color: var(--brass-dim); }
  .level-card .level-sub{ font-size:0.95rem; color: var(--ivory-dim); text-align:center; font-weight:600; }

  /* ---------- Game screen ---------- */
  #screen-game{ height:100vh; }
  .game-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px 8px;
  }
  .text-btn{ background:none; border:none; color: var(--ivory-dim); font-family:'Nunito', sans-serif; font-weight:700; font-size:0.95rem; cursor:pointer; padding:6px 0; }
  .text-btn:hover{ color: var(--ivory); }

  .score-display{ text-align:right; }
  .score-value{ font-family:'Baloo 2', sans-serif; font-size:1.3rem; font-weight:700; color: var(--brass-dim); font-variant-numeric: tabular-nums; }
  .score-label{ font-size:0.72rem; color: var(--ivory-dim); font-weight:700; }

  .game-panels{
    display:flex;
    flex:1;
    gap:16px;
    padding: 8px 16px 16px;
    border-radius:16px;
    transition: background-color .15s ease;
    min-height: 0;
  }
  .game-panels.flash-good{ background: var(--good); }
  .game-panels.flash-bad{ background: var(--bad); }
  @media (max-width:760px){ .game-panels{ flex-direction:column; } }

  .panel{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 14px;
    gap: 12px;
    min-height: 0;
    transition: opacity .18s ease;
  }
  .panel.hidden-phase{ opacity:0; pointer-events:none; }

  .panel-label{ font-size:0.76rem; color: var(--ivory-dim); text-transform:uppercase; letter-spacing:0.06em; }

  .staff-box{ width:100%; flex:1; min-height:170px; display:flex; align-items:center; justify-content:center; }
  .staff-box svg{ max-width:100%; max-height:100%; height:auto; display:block; overflow: visible; }

  #answer-staff-wrap{ cursor: crosshair; touch-action: none; }

  .clef-buttons{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; width:100%; }
  .clef-btn{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:1.05rem;
    padding: 16px 18px; border-radius: 16px; cursor:pointer;
    background: var(--ink-soft); color: var(--ivory); border: 2px solid var(--panel-line);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    flex:1; min-width:120px; max-width:180px;
    transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .clef-btn .clef-symbol{ font-size:2.6rem; line-height:1; }
  .clef-btn.active{ background: var(--brass); color: #fff; border-color: var(--brass-dim); }
  .clef-btn:hover{ border-color: var(--brass); }
  .clef-btn:active{ transform: translateY(1px); }

  .next-bar{ display:flex; justify-content:center; padding: 4px 16px 18px; }
  .next-bar.hidden-phase{ display:none; }

  /* ---------- Result screens ---------- */
  .result-screen{ margin:auto; text-align:center; padding: 40px 20px; max-width: 480px; }
  .result-screen h1{ font-size: 2.1rem; }
  .result-screen p{ color: var(--ivory-dim); margin-top: 12px; font-size: 1.02rem; }
  .result-actions{ margin-top: 28px; }
  .timestamp{ margin-top: 24px; font-size: 0.76rem; color: var(--panel-line); }
  .primary-btn{
    font-family:'Nunito', sans-serif; font-weight:800; font-size:1rem;
    padding: 14px 28px; border-radius: 12px; cursor:pointer; border:none;
    background: var(--brass); color: #fff;
  }
  .primary-btn:hover{ background: var(--brass-dim); }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="home-header">
      <h1>Match the Music</h1>
      <p class="subtitle">A clef and note flash briefly. Copy them on the empty music staff.</p>
    </div>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <button class="text-btn" id="quit-btn">&larr; Back to levels</button>
      <div class="score-display"><span class="score-value" id="score-value">0 / 10</span><span class="score-label"> points</span></div>
    </div>
    <div class="game-panels" id="game-panels">
      <div class="panel panel-prompt" id="panel-prompt">
        <div class="panel-label">Memorize this</div>
        <div class="staff-box" id="prompt-staff"></div>
      </div>
      <div class="panel panel-answer" id="panel-answer">
        <div class="panel-label">Place your answer</div>
        <div class="staff-box" id="answer-staff-wrap"><div id="answer-staff"></div></div>
        <div class="clef-buttons">
          <button class="clef-btn" id="btn-clef-treble" data-clef="treble"><span class="clef-symbol">𝄞</span><span>Treble</span></button>
          <button class="clef-btn" id="btn-clef-bass" data-clef="bass"><span class="clef-symbol">𝄢</span><span>Bass</span></button>
        </div>
      </div>
    </div>
    <div class="next-bar hidden-phase" id="next-bar">
      <button class="primary-btn" id="next-btn">Next</button>
    </div>
  </section>

  <!-- SUCCESS -->
  <section id="screen-success" class="screen">
    <div class="result-screen">
      <h1>Congratulations!</h1>
      <p id="success-detail"></p>
      <div class="result-actions">
        <button class="primary-btn" id="success-home-btn">Back to levels</button>
      </div>
      <p id="success-timestamp" class="timestamp"></p>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";

  var VF = Vex.Flow;

  // ================= Note pools (bottom of staff to top, 5 lines + 4 spaces) =================
  // Index order shared between clefs: 0 = bottom line, 8 = top line.
  var SLOT_LINES  = [4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5, 0];
  var TREBLE_NOTES = ['E4','F4','G4','A4','B4','C5','D5','E5','F5'];
  var BASS_NOTES   = ['G2','A2','B2','C3','D3','E3','F3','G3','A3'];

  var DURATIONS = [
    { code: 'w',  vf: 'w', dotted: false, label: 'Whole' },
    { code: 'h',  vf: 'h', dotted: false, label: 'Half' },
    { code: 'hd', vf: 'h', dotted: true,  label: 'Dotted half' },
    { code: 'q',  vf: 'q', dotted: false, label: 'Quarter' },
    { code: '8',  vf: '8', dotted: false, label: 'Eighth' },
    { code: '16', vf: '16', dotted: false, label: 'Sixteenth' }
  ];

  var ONSCREEN_TIME = { 1: 1000, 2: 750, 3: 500 };

  // Logical drawing coordinates (fed to VexFlow); the whole scene is then
  // upscaled via context.scale() so glyphs render larger, not just the box.
  var STAFF_CFG = { width: 340, height: 170, staveX: 14, staveY: 40, staveWidth: 300, spacing: 10 };
  var STAFF_SCALE = 1.45;
  var SVG_WIDTH = STAFF_CFG.width * STAFF_SCALE;
  var SVG_HEIGHT = STAFF_CFG.height * STAFF_SCALE;

  function randInt(max){ return Math.floor(Math.random() * max); }

  function slotNoteFor(clef, idx){
    return clef === 'treble' ? TREBLE_NOTES[idx] : BASS_NOTES[idx];
  }

  function pickRandomPrompt(){
    var clef = Math.random() < 0.5 ? 'treble' : 'bass';
    var idx = randInt(9);
    var duration = DURATIONS[randInt(DURATIONS.length)];
    return { clef: clef, note: slotNoteFor(clef, idx), duration: duration };
  }

  function toVexKey(noteName){
    var m = noteName.match(/^([A-G]#?)(\d)$/);
    return m[1].toLowerCase() + '/' + m[2];
  }

  // ================= Audio =================
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  document.addEventListener('click', function initAudioOnce(){
    ensureAudio();
    document.removeEventListener('click', initAudioOnce);
  });

  var SFX = {
    correct: new Audio('correct.mp3'),
    wrong: new Audio('wrong.mp3'),
    applause: new Audio('applause.mp3')
  };
  function playSfx(name){
    var base = SFX[name];
    if(!base) return;
    var el = base.cloneNode();
    el.play().catch(function(){ /* ignore autoplay/missing-file errors */ });
  }

  // ================= Staff rendering =================
  function renderStaffGeneric(container, clef, noteName, durationObj, isGhost){
    container.innerHTML = '';
    var renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
    renderer.resize(SVG_WIDTH, SVG_HEIGHT);
    var context = renderer.getContext();
    context.scale(STAFF_SCALE, STAFF_SCALE);
    context.setFillStyle('#C9BFAF');
    context.setStrokeStyle('#C9BFAF');

    var stave = new VF.Stave(STAFF_CFG.staveX, STAFF_CFG.staveY, STAFF_CFG.staveWidth);
    if(clef){ stave.addClef(clef); }
    stave.setContext(context).draw();

    if(clef && noteName && durationObj){
      var note = new VF.StaveNote({ clef: clef, keys: [toVexKey(noteName)], duration: durationObj.vf });
      var color = isGhost ? 'rgba(201,162,39,0.45)' : '#C9A227';
      note.setStyle({ fillStyle: color, strokeStyle: color });
      if(durationObj.dotted){ VF.Dot.buildAndAttach([note], { all: true }); }
      VF.Formatter.FormatAndDraw(context, stave, [note]);
    }
  }

  function renderPromptStaff(clef, note, durationObj){
    renderStaffGeneric(document.getElementById('prompt-staff'), clef, note, durationObj, false);
  }
  function clearPromptStaffDisplay(){
    document.getElementById('prompt-staff').innerHTML = '';
  }
  function renderAnswerStaff(){
    var noteName = (state.answerSlotIndex !== null && state.answerClef)
      ? slotNoteFor(state.answerClef, state.answerSlotIndex) : null;
    // Note duration is always auto-matched to the prompt's duration -- the
    // player only chooses the clef and the pitch location.
    renderStaffGeneric(document.getElementById('answer-staff'), state.answerClef, noteName, state.promptDuration, !state.locked);
  }
  function clearAnswerStaffDisplay(){
    document.getElementById('answer-staff').innerHTML = '';
  }

  // ================= Home screen =================
  var LEVEL_DEFS = [
    { level: 'practice', label: 'Practice', sub: 'Staff stays visible', practice: true, icon: '🌟' },
    { level: 1, label: 'Level 1', sub: '1.0 second flash', icon: '🎵' },
    { level: 2, label: 'Level 2', sub: '0.75 second flash', icon: '🎶' },
    { level: 3, label: 'Level 3', sub: '0.5 second flash', icon: '🏆' }
  ];

  function buildHomeScreen(){
    var grid = document.getElementById('level-grid');
    grid.innerHTML = '';
    LEVEL_DEFS.forEach(function(def){
      var card = document.createElement('div');
      card.className = 'level-card' + (def.practice ? ' practice-card' : '');
      var name = document.createElement('div');
      name.className = 'level-name';
      name.textContent = (def.icon ? def.icon + ' ' : '') + def.label;
      var sub = document.createElement('div');
      sub.className = 'level-sub';
      sub.textContent = def.sub;
      card.appendChild(name);
      card.appendChild(sub);
      card.addEventListener('click', function(){ startLevel(def.level); });
      grid.appendChild(card);
    });
  }

  // ================= Game state =================
  var state = {
    level: 1,
    score: 0,
    promptClef: null,
    promptNote: null,
    promptDuration: null,
    answerClef: null,
    answerSlotIndex: null,
    locked: false,
    reviewing: false,
    promptTimer: null
  };

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function updateScoreDisplay(){
    document.getElementById('score-value').textContent = state.score + ' / 10';
  }

  function showPromptPanel(){ document.getElementById('panel-prompt').classList.remove('hidden-phase'); }
  function hidePromptPanel(){ document.getElementById('panel-prompt').classList.add('hidden-phase'); }
  function showAnswerPanel(){ document.getElementById('panel-answer').classList.remove('hidden-phase'); }
  function hideAnswerPanel(){ document.getElementById('panel-answer').classList.add('hidden-phase'); }
  function showNextButton(){ document.getElementById('next-bar').classList.remove('hidden-phase'); }
  function hideNextButton(){ document.getElementById('next-bar').classList.add('hidden-phase'); }

  function flashPanels(kind){
    var el = document.getElementById('game-panels');
    el.classList.remove('flash-good', 'flash-bad');
    el.classList.add(kind === 'good' ? 'flash-good' : 'flash-bad');
  }
  function clearPanelFlash(){
    document.getElementById('game-panels').classList.remove('flash-good', 'flash-bad');
  }

  function updateClefButtonStyles(){
    document.getElementById('btn-clef-treble').classList.toggle('active', state.answerClef === 'treble');
    document.getElementById('btn-clef-bass').classList.toggle('active', state.answerClef === 'bass');
  }
  function selectClef(clef){
    if(state.locked || state.reviewing) return;
    state.answerClef = clef;
    updateClefButtonStyles();
    renderAnswerStaff();
  }

  function startLevel(level){
    ensureAudio();
    state.level = level;
    state.score = 0;
    updateScoreDisplay();
    clearPanelFlash();
    hideNextButton();
    showScreen('screen-game');
    startRound();
  }

  function resetAnswerState(){
    state.locked = false;
    state.reviewing = false;
    state.answerClef = null;
    state.answerSlotIndex = null;
    updateClefButtonStyles();
  }

  function startRound(){
    clearTimeout(state.promptTimer);
    resetAnswerState();

    showPromptPanel();
    var p = pickRandomPrompt();
    state.promptClef = p.clef;
    state.promptNote = p.note;
    state.promptDuration = p.duration;
    renderPromptStaff(p.clef, p.note, p.duration);

    if(state.level === 'practice'){
      // Practice: both panels stay visible together, no timer, no hiding.
      clearAnswerStaffDisplay();
      showAnswerPanel();
      renderAnswerStaff();
    } else {
      hideAnswerPanel();
      clearAnswerStaffDisplay();
      state.promptTimer = setTimeout(function(){
        hidePromptPanel();
        clearPromptStaffDisplay();
        showAnswerPanel();
        renderAnswerStaff();
      }, ONSCREEN_TIME[state.level]);
    }
  }

  function handleCorrect(){
    state.score = Math.min(10, state.score + 1);
    updateScoreDisplay();
    var won = state.score === 10;
    flashPanels('good');
    playSfx(won ? 'applause' : 'correct');
    setTimeout(function(){
      clearPanelFlash();
      if(won){ endInSuccess(); } else { startRound(); }
    }, 500);
  }

  function handleWrong(){
    state.score = Math.max(0, state.score - 1);
    updateScoreDisplay();
    flashPanels('bad');
    playSfx('wrong');
    state.reviewing = true;
    showPromptPanel();
    renderPromptStaff(state.promptClef, state.promptNote, state.promptDuration);
    showNextButton();
  }

  function onNextClicked(){
    if(!state.reviewing) return;
    clearPanelFlash();
    hideNextButton();
    if(state.level !== 'practice'){
      hidePromptPanel();
      clearPromptStaffDisplay();
    }
    state.reviewing = false;
    startRound();
  }

  function commitAnswer(){
    if(state.locked || state.reviewing) return;
    if(!state.answerClef || state.answerSlotIndex === null) return;
    state.locked = true;
    renderAnswerStaff();
    var placedNote = slotNoteFor(state.answerClef, state.answerSlotIndex);
    var correct = (state.answerClef === state.promptClef) && (placedNote === state.promptNote);
    if(correct){ handleCorrect(); } else { handleWrong(); }
  }

  function endInSuccess(){
    clearTimeout(state.promptTimer);
    var detail = document.getElementById('success-detail');
    detail.textContent = (state.level === 'practice')
      ? 'You reached 10 points in Practice mode.'
      : 'You reached 10 points on level ' + state.level + '.';
    var now = new Date();
    document.getElementById('success-timestamp').textContent =
      now.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) +
      ' \u00b7 ' + now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    showScreen('screen-success');
  }

  // ================= Answer staff interaction =================
  function getAnswerLocalY(evt){
    var svg = document.querySelector('#answer-staff svg');
    if(!svg) return null;
    var rect = svg.getBoundingClientRect();
    if(!rect.width) return null;
    var clientY;
    if(evt.touches && evt.touches.length){ clientY = evt.touches[0].clientY; }
    else if(evt.changedTouches && evt.changedTouches.length){ clientY = evt.changedTouches[0].clientY; }
    else { clientY = evt.clientY; }
    var scale = rect.width / SVG_WIDTH;
    return (clientY - rect.top) / scale;
  }

  function nearestSlotIndex(localY){
    var best = 0, bestDist = Infinity;
    SLOT_LINES.forEach(function(line, idx){
      var y = (STAFF_CFG.staveY + line * STAFF_CFG.spacing) * STAFF_SCALE;
      var dist = Math.abs(localY - y);
      if(dist < bestDist){ bestDist = dist; best = idx; }
    });
    return best;
  }

  function updateGhostFromEvent(evt){
    if(!state.answerClef || state.locked || state.reviewing) return;
    var localY = getAnswerLocalY(evt);
    if(localY === null) return;
    var idx = nearestSlotIndex(localY);
    if(idx !== state.answerSlotIndex){
      state.answerSlotIndex = idx;
      renderAnswerStaff();
    }
  }

  function wireAnswerInteraction(){
    var wrap = document.getElementById('answer-staff-wrap');
    wrap.addEventListener('mousemove', updateGhostFromEvent);
    wrap.addEventListener('click', function(evt){
      updateGhostFromEvent(evt);
      commitAnswer();
    });
    wrap.addEventListener('touchstart', function(evt){
      evt.preventDefault();
      updateGhostFromEvent(evt);
    }, { passive: false });
    wrap.addEventListener('touchmove', function(evt){
      evt.preventDefault();
      updateGhostFromEvent(evt);
    }, { passive: false });
    wrap.addEventListener('touchend', function(evt){
      evt.preventDefault();
      commitAnswer();
    }, { passive: false });
  }

  // ================= Wiring =================
  document.getElementById('quit-btn').addEventListener('click', function(){
    clearTimeout(state.promptTimer);
    showScreen('screen-home');
  });
  document.getElementById('success-home-btn').addEventListener('click', function(){ showScreen('screen-home'); });
  document.getElementById('btn-clef-treble').addEventListener('click', function(){ selectClef('treble'); });
  document.getElementById('btn-clef-bass').addEventListener('click', function(){ selectClef('bass'); });
  document.getElementById('next-btn').addEventListener('click', onNextClicked);

  wireAnswerInteraction();
  buildHomeScreen();
})();
</script>
</body>
</html>
